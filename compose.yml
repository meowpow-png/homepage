name: homepage

services:
  codex:
    image: ghcr.io/meowpow-png/mipe-runtime-codex-web:latest
    volumes:
      - codex-home:/home/dev/web/.codex
      - .:/workspace:z
    stdin_open: true
    tty: true

  claude:
    image: ghcr.io/meowpow-png/mipe-runtime-claude-web:latest
    volumes:
      - claude-home:/home/dev/web
      - .:/workspace:z
    stdin_open: true
    tty: true

  test:
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    working_dir: /workspace
    volumes:
      - .:/workspace:z
      - test-node-modules:/workspace/node_modules
    command: |
      sh -c "
        git config --global --add safe.directory /workspace &&
        npm ci &&
        npm run coverage &&
        npm run e2e
      "

volumes:
  codex-home:
  claude-home:
  test-node-modules:
