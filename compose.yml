name: homepage

services:
  codex:
    image: ghcr.io/meowpow-png/mipe-runtime-codex-web:latest
    volumes:
      - codex-home:/home/dev/web/.codex
      - .:/workspace:z
    stdin_open: true
    tty: true

  claude:
    image: ghcr.io/meowpow-png/mipe-runtime-claude-web:latest
    volumes:
      - claude-home:/home/dev/web
      - .:/workspace:z
    stdin_open: true
    tty: true

  test:
    build:
      context: .
      dockerfile: docker/test/Dockerfile
    image: homepage-test:local
    working_dir: /workspace
    volumes:
      - .:/workspace:z
      - test-node-modules:/workspace/node_modules
    command: sh docker/test/run.sh

volumes:
  codex-home:
  claude-home:
  test-node-modules:
